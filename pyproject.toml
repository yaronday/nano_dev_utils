[project]
name = "nano_dev_utils"
dynamic = ["version"]
authors = [
  { name="Yaron Dayan", email="griffon26base@gmail.com" },
]

description = "A collection of small Python utilities for developers."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

dependencies = [
]

[project.urls]
Homepage = "https://github.com/yaronday/nano_utils"
Issues = "https://github.com/yaronday/nano_utils/issues"
license = "https://github.com/yaronday/nano_dev_utils/blob/master/LICENSE"

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=nano_dev_utils --cov-report=term-missing"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "twine>=7.0.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
]

[build-system]
requires = ["hatchling >= 1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nano_dev_utils/__version__.py"
